# Nginx 反向代理：为企业微信回调提供 HTTPS 终止（企业微信要求公网 80/443）。
# 证书可用阿里云免费 SSL 证书或 certbot 签发，挂载到 /etc/nginx/certs。

server {
    listen 80;
    server_name _;

    # /metrics 仅供内部监控抓取（Prometheus / Grafana Cloud Agent），不对公网暴露。
    # 抓取方应在 Docker 网络内直连 http://app:8000/metrics（无需经过本 nginx），
    # 此处显式拒绝公网访问作为兜底防护。
    location /metrics {
        return 403;
    }

    # 企业微信回调要求 80/443；如已配置 HTTPS，可将非回调流量重定向到 443。
    # 若暂时仅用 HTTP 联调，可直接反代到 app（生产务必启用 HTTPS）。
    location / {
        resolver 127.0.0.11 valid=30s;
        set $app_upstream http://app:8000;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 把裸 ``/login`` 重定向到 ``/admin/login``（admin 容器内置的登录页）。
    # admin SPA 的 vue-router base 是 ``/admin/``，所以 ``/login`` 不会自然落到 SPA 路由。
    # 常见来源：用户收到 PetOps 链接但只复制了 ``/login`` 部分；或被同事告知"去 /login"。
    location = /login {
        return 302 /admin/login;
    }

    location /admin/ {
        resolver 127.0.0.11 valid=30s;
        set $admin_upstream http://admin:80;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
    }
}

server {
    listen 8443 ssl;
    server_name pokepet.dynv6.net;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /metrics {
        return 403;
    }

    location = /login {
        return 302 /admin/login;
    }

    location /admin/ {
        resolver 127.0.0.11 valid=30s;
        set $admin_upstream http://admin:80;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
    }

    location / {
        resolver 127.0.0.11 valid=30s;
        set $app_upstream http://app:8000;
        proxy_pass $app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
